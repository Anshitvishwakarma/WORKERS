# =====================================================================
# FixMate Application Configuration
# =====================================================================
server.port=8085

# Spring Application
spring.application.name=fixmate-backend

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/fixmate_db
spring.datasource.username=root
spring.datasource.password=anshit@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Security & JWT Configuration
# Note: Keep this secret safe in production. Override with JWT_SECRET environment variable.
fixmate.jwt.secret=${JWT_SECRET:FixMateSuperSecureSecretKeyThatIsAtLeast256BitsLong2026!}
fixmate.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Bootstrap Configuration
fixmate.admin.email=${ADMIN_EMAIL:admin@fixmate.com}
fixmate.admin.password=${ADMIN_PASSWORD:Admin@123456}
fixmate.admin.name=${ADMIN_NAME:FixMate Administrator}
fixmate.admin.phone=${ADMIN_PHONE:1800-FIX-MATE}
fixmate.admin.address=${ADMIN_ADDRESS:FixMate Global HQ, 100 Innovation Way}

# CORS Allowed Origins (Comma separated)
fixmate.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
