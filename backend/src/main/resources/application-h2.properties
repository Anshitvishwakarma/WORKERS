# =====================================================================
# FixMate Local H2 In-Memory Profile
# Use: --spring.profiles.active=h2
# =====================================================================
spring.datasource.url=jdbc:h2:mem:fixmate_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

fixmate.jwt.secret=FixMateSuperSecureSecretKeyThatIsAtLeast256BitsLong2026!
fixmate.jwt.expiration-ms=86400000

fixmate.admin.email=admin@fixmate.com
fixmate.admin.password=Admin@123456
fixmate.admin.name=FixMate Administrator
fixmate.admin.phone=1800-FIX-MATE
fixmate.admin.address=FixMate Global HQ, 100 Innovation Way

fixmate.cors.allowed-origins=*
